[project]
name = "manta-backend-adapter"
version = "0.1.0"
description = "Secure mobile flow ingest adapter for Wazuh/SIEM forwarding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.10.0",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "numpy==2.4.6",
  "scikit-learn==1.9.1",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]
audit = [
  "pip-audit==2.10.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
