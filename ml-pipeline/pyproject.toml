[project]
name = "manta-ml-pipeline"
version = "0.1.0"
description = "Feature engineering, anomaly training, and evaluation for Android flow metadata"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4",
  "pandas==3.0.6",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
]

[project.optional-dependencies]
tflite = [
  "tensorflow-cpu==2.21.0"
]
test = [
  "pytest==9.1.1"
]
audit = [
  "pip-audit==2.10.1"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
