[project]
name = "manta-backend-adapter"
version = "0.1.0"
description = "Secure mobile flow ingest adapter for Wazuh/SIEM forwarding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.147.0",
  "starlette==1.9.0",
  "uvicorn[standard]==0.32.1",
  "httpx==0.28.1",
  "pydantic==2.10.5",
  "numpy==2.2.1",
  "scikit-learn==1.6.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-cov==6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
