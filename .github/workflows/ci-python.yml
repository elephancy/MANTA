name: CI (Python)

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  repo-sanity:
    name: Repo sanity checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Legacy naming guard
        run: python tools/check_legacy_naming.py

      - name: Verify private deployment boundary
        run: python tools/check_deployment_boundary.py

      - name: Python syntax checks
        run: |
          python -m py_compile \
            backend-adapter/app/main.py \
            backend-adapter/app/models.py \
            backend-adapter/app/storage.py \
            backend-adapter/app/remote_modeling.py \
            ml-pipeline/src/ml_pipeline/train_remote_backend_model.py \
            tools/check_legacy_naming.py

  backend-tests:
    permissions:
      contents: read
    name: Backend adapter tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-adapter/pyproject.toml

      - name: Install backend dependencies
        run: |
          cd backend-adapter
          python -m pip install --upgrade pip
          pip install -e .[test,audit]

      - name: Audit backend runtime and test dependencies
        run: |
          python -m pip list --format=freeze --exclude-editable > "$RUNNER_TEMP/audit-requirements.txt"
          python -m pip_audit --strict --disable-pip --no-deps --vulnerability-service osv -r "$RUNNER_TEMP/audit-requirements.txt"

      - name: Run backend tests
        run: |
          cd backend-adapter
          pytest -q tests --cov=app --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Preserve manta-backend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-manta-backend
          path: backend-adapter/coverage.xml
          if-no-files-found: error
          retention-days: 7
      - name: Upload manta-backend coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CODECOV_UPLOAD_ENABLED == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: false
          files: ./backend-adapter/coverage.xml
          disable_search: true
          fail_ci_if_error: true
          version: v11.3.1
          cleanup: true

  ml-tests:
    name: MANTA ML pipeline tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-pipeline/pyproject.toml

      - name: Install ML dependencies
        run: |
          cd ml-pipeline
          python -m pip install --upgrade pip
          pip install -e .[test,audit]

      - name: Audit ML runtime and test dependencies
        run: |
          python -m pip list --format=freeze --exclude-editable > "$RUNNER_TEMP/audit-requirements.txt"
          python -m pip_audit --strict --disable-pip --no-deps --vulnerability-service osv -r "$RUNNER_TEMP/audit-requirements.txt"

      - name: Run ML tests
        run: |
          cd ml-pipeline
          pytest -q tests

  website:
    name: Website release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install exact website dependencies
        run: npm ci

      - name: Audit runtime and development dependencies
        run: npm audit --audit-level=high

      - name: Check website types
        run: npm run typecheck

      - name: Build release website
        run: npm run build
